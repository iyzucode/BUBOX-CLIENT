# Melayani hasil `expo export -p web` (output static). HTTPS & header keamanan diurus Caddy di depan.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Aset ber-hash dari Expo: aman di-cache selamanya (nama file berubah tiap build).
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Halaman: /orders → orders.html (static export). Selalu cek ulang agar rilis baru langsung terpakai.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
